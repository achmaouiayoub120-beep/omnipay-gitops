# =============================================================================
# kube-prometheus-stack — Helm Values pour OmniPay Zero-Trust (K3s)
# =============================================================================
# Cluster cible  : K3s (ressources limitées)
# Namespace       : monitoring
# Auteur          : P5 — Équipe SRE / Observabilité
# Date            : 2026-11-19
# Installation    : helm install monitoring prometheus-community/kube-prometheus-stack
#                   --namespace monitoring -f values-prometheus.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Prometheus Server
# -----------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    # Accepter TOUS les ServiceMonitor / PodMonitor / PrometheusRule
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

    # Rétention 7 jours
    retention: 7d
    retentionSize: "5GB"

    # Intervalle de scrape par défaut
    scrapeInterval: 15s
    evaluationInterval: 30s

    # Ressources adaptées K3s
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"

    # Stockage persistant
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

  # Exposer en NodePort 30900
  service:
    type: NodePort
    nodePort: 30900

# -----------------------------------------------------------------------------
# 2. Grafana
# -----------------------------------------------------------------------------
grafana:
  enabled: true
  adminUser: admin
  # Mot de passe de simulation académique — migration vers SealedSecrets en S2
  adminPassword: "GrafanaOmniPay2026!"

  service:
    type: NodePort
    nodePort: 30300

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
    dashboards:
      enabled: true
      searchNamespace: monitoring

  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Europe/Paris

  plugins:
    - grafana-piechart-panel

# -----------------------------------------------------------------------------
# 3. Alertmanager
# -----------------------------------------------------------------------------
alertmanager:
  enabled: true

  service:
    type: NodePort
    nodePort: 30903

  alertmanagerSpec:
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "100m"
    retention: 120h

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-receiver'
    receivers:
      - name: 'default-receiver'
        # Webhook/email à configurer en S2

# -----------------------------------------------------------------------------
# 4. Node Exporter
# -----------------------------------------------------------------------------
nodeExporter:
  enabled: true
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits:   { memory: "128Mi", cpu: "100m" }

# -----------------------------------------------------------------------------
# 5. kube-state-metrics
# -----------------------------------------------------------------------------
kubeStateMetrics:
  enabled: true
kube-state-metrics:
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits:   { memory: "128Mi", cpu: "100m" }

# -----------------------------------------------------------------------------
# 6. Prometheus Operator
# -----------------------------------------------------------------------------
prometheusOperator:
  resources:
    requests: { memory: "128Mi", cpu: "100m" }
    limits:   { memory: "256Mi", cpu: "200m" }

# -----------------------------------------------------------------------------
# 7. Composants désactivés (non compatibles K3s)
# -----------------------------------------------------------------------------
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# -----------------------------------------------------------------------------
# 8. Labels globaux
# -----------------------------------------------------------------------------
commonLabels:
  project: omnipay
  team: sre-p5
