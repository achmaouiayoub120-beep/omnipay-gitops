# ==============================================================================
# OmniPay Zero-Trust — AnalysisTemplate : Taux d'erreur HTTP 5xx (Environnement Prod)
# Source de métriques : Prometheus interne (kube-prometheus-stack P5)
# Rôle P4 : Livraison & Chaîne d'Approvisionnement
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: prometheus-error-rate-5xx
  namespace: omnipay-prod
  labels:
    app.kubernetes.io/name: transaction-service
    app.kubernetes.io/part-of: omnipay-zero-trust
spec:
  args:
    - name: service-name
      value: transaction-service
  metrics:
    - name: http-5xx-error-rate
      interval: 10s
      count: 3
      failureLimit: 1
      successCondition: result[0] < 2.0
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
          query: |
            (
              sum(rate(http_requests_total{status=~"5.*", app="{{args.service-name}}"}[1m]))
              /
              (sum(rate(http_requests_total{app="{{args.service-name}}"}[1m])) > 0)
            ) * 100 or vector(0)
