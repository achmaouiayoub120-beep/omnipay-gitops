# ==============================================================================
# OmniPay Zero-Trust — NetworkPolicies (Production : Micro-segmentation Stricte)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: omnipay-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-and-monitoring
  namespace: omnipay-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Trafic intra-namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: omnipay-prod
    # Scraping Prometheus par le namespace monitoring (P5)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8081
    # Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Communication autorisée entre microservices OmniPay
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: omnipay-prod
    # Résolution DNS CoreDNS K3s
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
