# ==============================================================================
# OmniPay Zero-Trust — Services Kubernetes pour Argo Rollouts Canary (Prod)
# Services Stable (active) et Canary (canary) pour transaction-service
# Rôle P4 : Widad El Gharzaz (Packaging, Harbor, Argo Rollouts & Kyverno)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: transaction-service-active
  namespace: omnipay-prod
  labels:
    app: transaction-service
    role: stable
    app.kubernetes.io/name: transaction-service
    app.kubernetes.io/part-of: omnipay-zero-trust
    monitored: "true"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 8081
      targetPort: 8081
  selector:
    app: transaction-service
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service-canary
  namespace: omnipay-prod
  labels:
    app: transaction-service
    role: canary
    app.kubernetes.io/name: transaction-service
    app.kubernetes.io/part-of: omnipay-zero-trust
    monitored: "true"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 8081
      targetPort: 8081
  selector:
    app: transaction-service
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: omnipay-prod
  labels:
    app: transaction-service
    app.kubernetes.io/name: transaction-service
    app.kubernetes.io/part-of: omnipay-zero-trust
    monitored: "true"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 8081
      targetPort: 8081
  selector:
    app: transaction-service
