# ==============================================================================
# OmniPay Zero-Trust — Argo Rollouts Manifest : Transaction Service (Prod)
# Stratégie Canary progressive : 10% -> 33% -> 66% -> 100% avec analyse Prometheus
# Rôle P4 : Widad El Gharzaz (Packaging, Harbor, Argo Rollouts & Kyverno)
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: transaction-service
  namespace: omnipay-prod
  labels:
    app: transaction-service
    app.kubernetes.io/name: transaction-service
    app.kubernetes.io/part-of: omnipay-zero-trust
    monitored: "true"
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: transaction-service
  strategy:
    canary:
      stableService: transaction-service-active
      canaryService: transaction-service-canary
      trafficRouting:
        nginx:
          stableIngress: transaction-service-ingress
      steps:
        # Palier 1 : Injection de 10% du trafic sur la nouvelle version (Canary)
        # Blast Radius strictement limité à 10% des flux bancaires
        - setWeight: 10
        - pause:
            duration: 1m
        - analysis:
            templates:
              - templateName: prometheus-error-rate
            args:
              - name: service-name
                value: transaction-service

        # Palier 2 : Montée en charge à 33% du trafic
        - setWeight: 33
        - pause:
            duration: 1m
        - analysis:
            templates:
              - templateName: prometheus-error-rate
            args:
              - name: service-name
                value: transaction-service

        # Palier 3 : Montée en charge à 66% du trafic
        - setWeight: 66
        - pause:
            duration: 1m
        - analysis:
            templates:
              - templateName: prometheus-error-rate
            args:
              - name: service-name
                value: transaction-service

        # Palier 4 : Promotion complète à 100% (Version stable finale)
        - setWeight: 100
  template:
    metadata:
      labels:
        app: transaction-service
        app.kubernetes.io/name: transaction-service
        app.kubernetes.io/part-of: omnipay-zero-trust
        monitored: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transaction-service
          image: harbor.omnipay.local:30002/omnipay/transaction-service:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SERVER_PORT
              value: "8080"
            - name: MANAGEMENT_SERVER_PORT
              value: "8081"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tmp-volume
          emptyDir: {}
